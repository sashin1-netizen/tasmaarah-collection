name: Production Quality

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production files and pages
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html about.html shop.html occasions.html custom-orders.html gallery.html contact.html 404.html styles.css final-polish.css reference-match.css hero-approved.css script.js robots.txt sitemap.xml; do
            test -s "$file"
          done
          test -d assets/images
          test "$(find assets/images -maxdepth 1 -type f | wc -l)" -ge 20
          test -s assets/images/file_00000000d5e88243924fe08befb57f2a.png
          grep -qi '<!doctype html>' index.html
          grep -q 'styles.css?v=' index.html
          grep -q 'reference-match.css?v=' index.html
          grep -q 'hero-approved.css?v=' index.html
          grep -q 'script.js?v=' index.html
          grep -q 'viewport' index.html
          grep -q 'description' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'wa.me/27635409729' index.html contact.html
          ! grep -q 'luxury-final.css' index.html
          ! grep -q 'mobile-reference-fix.css' index.html
          ! grep -q 'hero-loader.js' index.html

      - name: Verify referenced local assets and internal links
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')
          missing = []
          html_files = sorted(root.glob('*.html'))
          sources = html_files + [root / 'styles.css', root / 'final-polish.css', root / 'reference-match.css', root / 'hero-approved.css', root / 'script.js']
          for source in sources:
              text = source.read_text(encoding='utf-8')
              refs = set(re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']', text))
              refs |= set(re.findall(r'url\([\"\']?([^\)\"\']+)', text))
              for ref in refs:
                  if ref.startswith(('http://', 'https://', 'mailto:', 'tel:', 'data:', '#', 'javascript:', '%23')):
                      continue
                  path = ref.split('?', 1)[0].split('#', 1)[0].lstrip('/')
                  if path and not (root / path).exists():
                      missing.append((source.name, ref))
          if missing:
              raise SystemExit('Missing local references: ' + repr(missing))
          print(f'Validated {len(html_files)} HTML pages and all local references.')

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Verify responsive and interaction hooks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'menu-button' script.js
          grep -q 'quote-form' script.js
          grep -q 'search-overlay' script.js
          grep -q 'lightbox' script.js
          grep -q '@media(max-width:760px)' hero-approved.css
          grep -q '@media(max-width:900px)' final-polish.css
          grep -q 'ref-occ-grid' reference-match.css

      - name: Check production files for development placeholders
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'localhost|127\.0\.0\.1|TODO|FIXME|lorem ipsum' --include='*.html' --include='*.css' --include='*.js' --include='*.txt' .

      - name: Confirm sitemap coverage
        shell: python
        run: |
          from pathlib import Path
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          for page in ('about.html','shop.html','occasions.html','custom-orders.html','gallery.html','contact.html'):
              if page not in sitemap:
                  raise SystemExit(f'Missing {page} from sitemap.xml')
          print('Sitemap covers all public pages.')
