name: Production Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s robots.txt
          test -d assets/images
          grep -q '<!doctype html>' index.html
          grep -q 'styles.css' index.html
          grep -q 'script.js' index.html
          grep -q 'viewport' index.html
          grep -q 'description' index.html
      - name: Verify referenced local assets
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')
          missing = []
          for source in ('index.html', 'styles.css', 'script.js'):
              text = (root / source).read_text(encoding='utf-8')
              refs = set(re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']', text))
              refs |= set(re.findall(r'url\([\"\']?([^\)\"\']+)', text))
              for ref in refs:
                  if ref.startswith(('http://','https://','mailto:','tel:','data:','#','javascript:')):
                      continue
                  path = ref.split('?',1)[0].split('#',1)[0].lstrip('/')
                  if path and not (root / path).exists():
                      missing.append((source, ref))
          if missing:
              raise SystemExit('Missing local references: ' + repr(missing))
          print('All referenced local assets exist.')
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check for accidental development placeholders
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'localhost|127\.0\.0\.1|TODO|FIXME|lorem ipsum' --exclude-dir=.git --exclude='quality.yml' .
