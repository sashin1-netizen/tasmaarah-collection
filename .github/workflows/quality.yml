name: Production Quality

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production files and pages
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html about.html shop.html occasions.html custom-orders.html gallery.html contact.html 404.html styles.css final-polish.css reference-match.css hero-approved.css interactive-texture.css script.js robots.txt sitemap.xml; do
            test -s "$file"
          done
          test -d assets/images
          test "$(find assets/images -maxdepth 1 -type f | wc -l)" -ge 20
          test -s assets/images/file_00000000d5e88243924fe08befb57f2a.png
          for obsolete in luxury-final.css mobile-reference-fix.css hero-loader.js hero-part-1.js hero-tiny-1.js hero-tiny-2.js hero-tiny-3.js; do test ! -e "$obsolete"; done

      - name: Verify every public page uses identical production assets
        shell: python
        run: |
          from pathlib import Path
          pages=['index.html','about.html','shop.html','occasions.html','custom-orders.html','gallery.html','contact.html','404.html']
          failures=[]
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              for needle in ('styles.css?v=22','final-polish.css?v=3','interactive-texture.css?v=5','script.js?v=27'):
                  if needle not in text:
                      failures.append(f'{page}: missing or stale {needle}')
              for bad in ('luxury-final.css','mobile-reference-fix.css','hero-loader.js','hero-part-1.js','hero-tiny-1.js','hero-tiny-2.js','hero-tiny-3.js'):
                  if bad in text:
                      failures.append(f'{page}: obsolete reference {bad}')
          home=Path('index.html').read_text(encoding='utf-8')
          for needle in ('reference-match.css?v=9','hero-approved.css?v=6','application/ld+json','wa.me/27635409729'):
              if needle not in home: failures.append(f'index.html: missing {needle}')
          if failures: raise SystemExit('\n'.join(failures))
          print('All public pages use the same audited CSS and JS versions.')

      - name: Verify referenced local assets and internal links
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          missing=[]
          sources=sorted(root.glob('*.html'))+[root/'styles.css',root/'final-polish.css',root/'reference-match.css',root/'hero-approved.css',root/'interactive-texture.css',root/'script.js']
          for source in sources:
              text=source.read_text(encoding='utf-8')
              refs=set(re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']',text))
              refs|=set(re.findall(r'url\([\"\']?([^\)\"\']+)',text))
              for ref in refs:
                  if ref.startswith(('http://','https://','mailto:','tel:','data:','#','javascript:','%23')): continue
                  path=ref.split('?',1)[0].split('#',1)[0].lstrip('/')
                  if path and not (root/path).exists(): missing.append((source.name,ref))
          if missing: raise SystemExit('Missing local references: '+repr(missing))
          print('All local asset and internal-link targets exist.')

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Verify interaction and animation contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'menu-button' script.js
          grep -q 'quote-form' script.js
          grep -q 'search-overlay' script.js
          grep -q 'lightbox' script.js
          grep -q 'pointermove' script.js
          ! grep -q 'texture-orbit' script.js
          grep -q '@keyframes ambientBreath' interactive-texture.css
          grep -q '@keyframes satinTravel' interactive-texture.css
          grep -q 'pointer-events:none!important' interactive-texture.css
          grep -q '@media(max-width:760px)' interactive-texture.css
          grep -q '@media(max-width:760px)' hero-approved.css
          grep -q '@media(max-width:900px)' final-polish.css
          grep -q 'action="https://wa.me/27635409729"' contact.html
          grep -q 'Open WhatsApp directly' contact.html

      - name: Check production files for development placeholders
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'localhost|127\.0\.0\.1|TODO|FIXME|lorem ipsum' --include='*.html' --include='*.css' --include='*.js' --include='*.txt' .

      - name: Confirm sitemap coverage
        shell: python
        run: |
          from pathlib import Path
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          for page in ('about.html','shop.html','occasions.html','custom-orders.html','gallery.html','contact.html'):
              if page not in sitemap: raise SystemExit(f'Missing {page} from sitemap.xml')
          print('Sitemap covers all public pages.')
