name: Production Quality

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production contract
        shell: python
        run: |
          from pathlib import Path
          pages=['index.html','about.html','shop.html','occasions.html','custom-orders.html','gallery.html','contact.html','privacy.html','404.html']
          required=['site.css','client-final.css','stability-lock.css','premium-media.css','desktop-polish.css','final-polish.css','site-experience.css','script.js','robots.txt','sitemap.xml','package.json','playwright.config.js','tests/site.spec.js','tests/media.spec.js']
          for f in pages+required:
              if not Path(f).is_file() or Path(f).stat().st_size == 0: raise SystemExit(f'Missing/empty: {f}')
          if len(list(Path('assets/images').glob('*'))) < 20: raise SystemExit('Too few production images')
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              for needle in ('site.css?v=2','client-final.css?v=2','stability-lock.css?v=4','class="mobile-menu"','class="skip-link"'):
                  if needle not in text: raise SystemExit(f'{page}: missing {needle}')
              if 'motion-toggle' in text: raise SystemExit(f'{page}: motion control must not be client-facing')
              if text.count('<h1') != 1: raise SystemExit(f'{page}: expected exactly one h1')
          home=Path('index.html').read_text(encoding='utf-8')
          for needle in ('class="hero-art"','fetchpriority="high"','wa.me/27635409729','https://www.instagram.com/boxes_tasmaarah_collection','application/ld+json','class="social-showcase"','Content-Security-Policy','site-experience.css?v=1'):
              if needle not in home: raise SystemExit(f'index.html missing {needle}')
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          for page in pages[:-1]:
              target='https://sashin1-netizen.github.io/tasmaarah-collection/'+('' if page=='index.html' else page)
              if target not in sitemap: raise SystemExit(f'sitemap missing {target}')
          script=Path('script.js').read_text(encoding='utf-8')
          for needle in ('desktop-polish.css?v=2','site-experience.css?v=1','cookie-notice','social-icons','lightbox-enquire','data-catalog-search'):
              if needle not in script: raise SystemExit(f'script.js missing {needle}')
          pw=Path('playwright.config.js').read_text(encoding='utf-8')
          for needle in ("browserName: 'chromium'","browserName: 'firefox'","browserName: 'webkit'","iPhone 13 Mini","iPad Pro 11"):
              if needle not in pw: raise SystemExit(f'playwright.config.js missing cross-browser contract: {needle}')
          print('Production contract validated.')
      - name: Verify local links and image alternatives
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          root=Path('.'); missing=[]; missing_alt=[]
          class Inspector(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='img' and 'alt' not in d: missing_alt.append(d.get('src'))
          for page in root.glob('*.html'):
              text=page.read_text(encoding='utf-8'); Inspector().feed(text)
              for ref in set(re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']',text)):
                  if ref.startswith(('http://','https://','mailto:','tel:','data:','#')): continue
                  p=ref.split('?',1)[0].split('#',1)[0].lstrip('/')
                  if p and not (root/p).exists(): missing.append((page.name,ref))
          if missing: raise SystemExit(f'Missing local refs: {missing}')
          if missing_alt: raise SystemExit(f'Images missing alt: {missing_alt}')
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check playwright.config.js
          node --check tests/site.spec.js
          node --check tests/media.spec.js
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Run Chromium Firefox and WebKit acceptance suite
        run: npm run test:e2e
      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-acceptance-evidence
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
