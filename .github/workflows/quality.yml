name: Production Quality

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html about.html shop.html occasions.html custom-orders.html gallery.html contact.html 404.html site.css atelier-client-ready.css mobile-recovery-v2.css script.js robots.txt sitemap.xml package.json playwright.config.js tests/site.spec.js; do
            test -s "$file"
          done
          test -d assets/images
          test "$(find assets/images -maxdepth 1 -type f | wc -l)" -ge 20
          test -s assets/images/tasmaarah-logo.webp
          test -s assets/images/file_00000000d5e88243924fe08befb57f2a.png
          for legacy in styles.css final-polish.css reference-match.css hero-approved.css atelier-final.css interaction-fix.css interactive-texture.css texture.css luxury-final.css mobile-reference-fix.css; do
            test ! -e "$legacy"
          done

      - name: Verify production design system
        shell: python
        run: |
          from pathlib import Path
          pages=['index.html','about.html','shop.html','occasions.html','custom-orders.html','gallery.html','contact.html','404.html']
          banned=['styles.css','final-polish.css','reference-match.css','hero-approved.css','atelier-final.css','interaction-fix.css','interactive-texture.css','texture.css','luxury-final.css','mobile-reference-fix.css']
          failures=[]
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              for needle in ('site.css?v=1','script.js?v=40' if page != '404.html' else 'script.js?v=34','class="mobile-menu"','class="motion-toggle"','class="skip-link"'):
                  if needle not in text: failures.append(f'{page}: missing {needle}')
              for old in banned:
                  if old in text: failures.append(f'{page}: legacy stylesheet reference {old}')
              if '<meta name="viewport"' not in text: failures.append(f'{page}: missing viewport')
              if '<title>' not in text: failures.append(f'{page}: missing title')
          home=Path('index.html').read_text(encoding='utf-8')
          for needle in ('application/ld+json','class="hero-art"','fetchpriority="high"','width="1536"','height="1024"','wa.me/27635409729'):
              if needle not in home: failures.append(f'index.html: missing {needle}')
          if failures: raise SystemExit('\n'.join(failures))
          print('All public pages use the production design system and current interaction build.')

      - name: Verify local assets and internal links
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          root=Path('.')
          missing=[]
          duplicate_ids=[]
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get('id'): self.ids.append(d['id'])
          for page in sorted(root.glob('*.html')):
              text=page.read_text(encoding='utf-8')
              parser=Inspector(); parser.feed(text)
              seen=set()
              for ident in parser.ids:
                  if ident in seen: duplicate_ids.append((page.name,ident))
                  seen.add(ident)
              refs=set(re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']',text))
              for ref in refs:
                  if ref.startswith(('http://','https://','mailto:','tel:','data:','#')): continue
                  path=ref.split('?',1)[0].split('#',1)[0].lstrip('/')
                  if path and not (root/path).exists(): missing.append((page.name,ref))
          for css_name in ('site.css','atelier-client-ready.css','mobile-recovery-v2.css'):
              css=Path(css_name).read_text(encoding='utf-8')
              for ref in re.findall(r'url\([\"\']?([^\)\"\']+)',css):
                  if ref.startswith(('http://','https://','data:')): continue
                  path=ref.split('?',1)[0].lstrip('/')
                  if path and not (root/path).exists(): missing.append((css_name,ref))
          if missing: raise SystemExit('Missing local references: '+repr(missing))
          if duplicate_ids: raise SystemExit('Duplicate IDs: '+repr(duplicate_ids))
          print('Local links, assets and document IDs validated.')

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check playwright.config.js
          node --check tests/site.spec.js

      - name: Verify resilient navigation and interaction contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "querySelector('.mobile-menu')" script.js
          grep -q "menu.addEventListener('toggle'" script.js
          grep -q "e.key==='Escape'" script.js
          grep -q 'document.body.style.overflow' script.js
          grep -q 'quote-form' script.js
          grep -q 'data-catalog-search' script.js
          grep -q 'lightbox' script.js
          grep -q 'pointermove' script.js
          grep -q 'prefers-reduced-motion' script.js
          grep -q '@keyframes ambientMove' site.css
          grep -q '@keyframes satinSweep' atelier-client-ready.css
          grep -q '@media(prefers-reduced-motion:reduce)' atelier-client-ready.css
          grep -q ':focus-visible' site.css
          grep -q '.mobile-menu\[open\]' site.css
          grep -q 'pointer-events:none' site.css
          grep -q 'action="https://api.whatsapp.com/send"' contact.html
          grep -q 'Open WhatsApp directly' contact.html

      - name: Check production files for placeholders
        shell: bash
        run: |
          set -euo pipefail
          ! grep -niE 'localhost|127\.0\.0\.1|TODO|FIXME|lorem ipsum' *.html site.css atelier-client-ready.css mobile-recovery-v2.css script.js robots.txt sitemap.xml

      - name: Confirm sitemap coverage
        shell: python
        run: |
          from pathlib import Path
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          for page in ('about.html','shop.html','occasions.html','custom-orders.html','gallery.html','contact.html'):
              if page not in sitemap: raise SystemExit(f'Missing {page} from sitemap.xml')
          print('Sitemap covers every indexable public page.')

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run responsive browser acceptance suite
        run: npm run test:e2e

      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-acceptance-evidence
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
