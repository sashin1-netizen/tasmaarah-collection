name: Production Quality

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production files and public-page contract
        shell: python
        run: |
          from pathlib import Path
          pages=['index.html','about.html','shop.html','occasions.html','custom-orders.html','gallery.html','contact.html','404.html']
          required=['site.css','client-final.css','stability-lock.css','script.js','robots.txt','sitemap.xml','package.json','playwright.config.js','tests/site.spec.js']
          for f in pages+required:
              if not Path(f).is_file() or Path(f).stat().st_size == 0: raise SystemExit(f'Missing/empty: {f}')
          if len(list(Path('assets/images').glob('*'))) < 20: raise SystemExit('Too few production images')
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              for needle in ('site.css?v=2','client-final.css?v=2','stability-lock.css?v=4','script.js?v=40','class="mobile-menu"','class="skip-link"'):
                  if needle not in text: raise SystemExit(f'{page}: missing {needle}')
              if 'motion-toggle' in text: raise SystemExit(f'{page}: client-facing motion control must not be present')
              if text.count('<h1') != 1: raise SystemExit(f'{page}: expected exactly one h1')
          home=Path('index.html').read_text(encoding='utf-8')
          for needle in ('class="hero-art"','fetchpriority="high"','wa.me/27635409729','https://www.instagram.com/boxes_tasmaarah_collection','application/ld+json'):
              if needle not in home: raise SystemExit(f'index.html missing {needle}')
          lock=Path('stability-lock.css').read_text(encoding='utf-8')
          for needle in ('.motion-toggle{display:none!important}','.mobile-menu[open]>.mobile-panel','position:fixed!important','width:100vw!important','.masonry-gallery figure','prefers-reduced-motion'):
              if needle not in lock: raise SystemExit(f'stability-lock.css missing {needle}')
          print('Production contract validated.')

      - name: Verify local links and image alternatives
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          root=Path('.'); missing=[]; missing_alt=[]
          class Inspector(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='img' and 'alt' not in d: missing_alt.append(d.get('src'))
          for page in root.glob('*.html'):
              text=page.read_text(encoding='utf-8'); Inspector().feed(text)
              for ref in set(re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']',text)):
                  if ref.startswith(('http://','https://','mailto:','tel:','data:','#')): continue
                  p=ref.split('?',1)[0].split('#',1)[0].lstrip('/')
                  if p and not (root/p).exists(): missing.append((page.name,ref))
          if missing: raise SystemExit(f'Missing local refs: {missing}')
          if missing_alt: raise SystemExit(f'Images missing alt: {missing_alt}')

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check playwright.config.js
          node --check tests/site.spec.js

      - name: Verify critical interaction contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "summary?.addEventListener('pointerup'" script.js
          grep -q "e.key==='Escape'" script.js
          grep -q 'boxes_tasmaarah_collection' script.js
          grep -q 'quote-form' script.js
          grep -q 'lightbox-enquire' script.js
          grep -q 'data-catalog-search' script.js
          grep -q 'action="https://api.whatsapp.com/send"' contact.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run responsive browser acceptance suite
        run: npm run test:e2e

      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-acceptance-evidence
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
