name: Production Quality

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html about.html shop.html occasions.html custom-orders.html gallery.html contact.html 404.html site.css client-final.css stability-lock.css script.js robots.txt sitemap.xml package.json playwright.config.js tests/site.spec.js; do
            test -s "$file"
          done
          test -d assets/images
          test "$(find assets/images -maxdepth 1 -type f | wc -l)" -ge 20
          test -s assets/images/tasmaarah-logo.webp
          test -s assets/images/file_00000000d5e88243924fe08befb57f2a.png
          test ! -e atelier-client-ready.css
          test ! -e homepage-client-fix.css
          test ! -e homepage-client-fix.js

      - name: Verify final production contract on every public page
        shell: python
        run: |
          from pathlib import Path
          pages=['index.html','about.html','shop.html','occasions.html','custom-orders.html','gallery.html','contact.html','404.html']
          indexable=set(pages)-{'404.html'}
          failures=[]
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              for needle in ('site.css?v=2','client-final.css?v=2','stability-lock.css?v=3','script.js?v=39','class="mobile-menu"','class="motion-toggle"','class="skip-link"'):
                  if needle not in text: failures.append(f'{page}: missing {needle}')
              for needle in ('<meta name="viewport"','<meta name="referrer"','<meta name="color-scheme"','<title>'):
                  if needle not in text: failures.append(f'{page}: missing {needle}')
              if page in indexable:
                  for needle in ('<meta name="description"','rel="canonical"'):
                      if needle not in text: failures.append(f'{page}: missing {needle}')
              if text.count('<h1') != 1: failures.append(f'{page}: expected exactly one h1')
          home=Path('index.html').read_text(encoding='utf-8')
          for needle in ('application/ld+json','class="hero-art"','fetchpriority="high"','loading="eager"','width="1536"','height="1024"','wa.me/27635409729','og:image:width','twitter:card','https://www.instagram.com/boxes_tasmaarah_collection'):
              if needle not in home: failures.append(f'index.html: missing {needle}')
          lock=Path('stability-lock.css').read_text(encoding='utf-8')
          for needle in ('position:fixed!important','width:100vw!important','order:1!important','order:2!important','.floating-wa::before','lightbox-enquire','catalog-results-status','prefers-reduced-motion','prefers-contrast','.mobile-menu:not([open])>.mobile-panel','footer-instagram'):
              if needle not in lock: failures.append(f'stability-lock.css: missing {needle}')
          if failures: raise SystemExit('\n'.join(failures))
          print('Every public page satisfies the client-ready production contract.')

      - name: Verify local assets, internal links and image alternatives
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          root=Path('.'); missing=[]; duplicate_ids=[]; missing_alt=[]
          class Inspector(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.images=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get('id'): self.ids.append(d['id'])
                  if tag=='img': self.images.append(d)
          for page in sorted(root.glob('*.html')):
              text=page.read_text(encoding='utf-8'); parser=Inspector(); parser.feed(text); seen=set()
              for ident in parser.ids:
                  if ident in seen: duplicate_ids.append((page.name,ident))
                  seen.add(ident)
              for img in parser.images:
                  if 'alt' not in img: missing_alt.append((page.name,img.get('src')))
              refs=set(re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']',text))
              for ref in refs:
                  if ref.startswith(('http://','https://','mailto:','tel:','data:','#')): continue
                  path=ref.split('?',1)[0].split('#',1)[0].lstrip('/')
                  if path and not (root/path).exists(): missing.append((page.name,ref))
          for css_name in ('site.css','client-final.css','stability-lock.css'):
              css=Path(css_name).read_text(encoding='utf-8')
              for ref in re.findall(r'url\([\"\']?([^\)\"\']+)',css):
                  if ref.startswith(('http://','https://','data:')): continue
                  path=ref.split('?',1)[0].lstrip('/')
                  if path and not (root/path).exists(): missing.append((css_name,ref))
          if missing: raise SystemExit('Missing local references: '+repr(missing))
          if duplicate_ids: raise SystemExit('Duplicate IDs: '+repr(duplicate_ids))
          if missing_alt: raise SystemExit('Images missing alt: '+repr(missing_alt))
          print('Local links, assets, alt text and document IDs validated.')

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check playwright.config.js
          node --check tests/site.spec.js

      - name: Verify resilient interaction contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "querySelector('.mobile-menu')" script.js
          grep -q "summary?.addEventListener('click'" script.js
          grep -q "menu.addEventListener('toggle'" script.js
          grep -q "e.key==='Escape'" script.js
          grep -q "width:'100vw'" script.js
          grep -q 'document.body.style.overflow' script.js
          grep -q 'quote-form' script.js
          grep -q 'data-catalog-search' script.js
          grep -q 'catalog-results-status' script.js
          grep -q 'lightbox-enquire' script.js
          grep -q 'pointermove' script.js
          grep -q 'tasmaarah-motion-v3' script.js
          grep -q 'boxes_tasmaarah_collection' script.js
          grep -q 'position:fixed!important' stability-lock.css
          grep -q 'width:100vw!important' stability-lock.css
          grep -q 'pointer-events:none!important' stability-lock.css
          grep -q 'action="https://api.whatsapp.com/send"' contact.html
          grep -q 'Open WhatsApp directly' contact.html
          grep -q 'contact.html?occasion=Wedding' occasions.html
          grep -q 'contact.html?material=Perspex' shop.html

      - name: Check production files for placeholders
        shell: bash
        run: |
          set -euo pipefail
          ! grep -niE 'localhost|127\.0\.0\.1|TODO|FIXME|lorem ipsum' *.html site.css client-final.css stability-lock.css script.js robots.txt sitemap.xml

      - name: Confirm sitemap and robots coverage
        shell: python
        run: |
          from pathlib import Path
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8'); robots=Path('robots.txt').read_text(encoding='utf-8')
          for page in ('about.html','shop.html','occasions.html','custom-orders.html','gallery.html','contact.html'):
              if page not in sitemap: raise SystemExit(f'Missing {page} from sitemap.xml')
          if 'Sitemap: https://sashin1-netizen.github.io/tasmaarah-collection/sitemap.xml' not in robots: raise SystemExit('robots.txt sitemap declaration missing')
          print('Search-engine discovery files validated.')

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run responsive browser acceptance suite
        run: npm run test:e2e

      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-acceptance-evidence
          path: visual-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
